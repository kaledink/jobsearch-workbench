name: 每日招聘 · 截止优先
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '重新检索今天的招聘（已入库岗位不会重复）'
        type: boolean
        default: false
permissions:
  contents: write
  models: read
concurrency:
  group: daily-private-recruitment
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verified-index dependencies
        run: python -m pip install -r .github/recruitment/requirements.txt
      - name: Collect, verify, prioritize deadlines and merge privately
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          args=()
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          python .github/recruitment/collector.py --snapshot "$RUNNER_TEMP/recruitment-sources.json" "${args[@]}"
      - name: Preserve public-source evidence privately for three days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recruitment-public-sources
          path: ${{ runner.temp }}/recruitment-sources.json
          if-no-files-found: ignore
          retention-days: 3
