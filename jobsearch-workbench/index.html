<!doctype html>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaledin 求职工作台</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: dossier desk — fixed left index rail, working sheet on the right; detail opens as a full sheet over the list */
:root{
  --bg:#eef0ec; --sheet:#fbfcfa; --sunk:#e4e8e3; --ink:#1b2220; --muted:#5d6a65; --line:#d3d9d3;
  --accent:#1e5d68; --accent-ink:#ffffff; --accent-soft:#d6e7e8;
  --ok:#2c7a4b; --ok-soft:#dcefe2; --warn:#a96a12; --warn-soft:#f6e8cf; --bad:#b03a35; --bad-soft:#f5dcda;
  --stamp:#9b3b2e;
  --f-display:"Noto Serif SC","Songti SC","STSong",serif;
  --f-body:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:8px; --shadow:0 1px 2px rgba(20,30,28,.06),0 8px 24px rgba(20,30,28,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121615; --sheet:#191e1d; --sunk:#222827; --ink:#e3e9e6; --muted:#97a39e; --line:#2d3533;
  --accent:#6db2bd; --accent-ink:#0e1a1c; --accent-soft:#1f3639;
  --ok:#6cc08d; --ok-soft:#1d3326; --warn:#e0a54c; --warn-soft:#382b17; --bad:#ec817b; --bad-soft:#3d2120;
  --stamp:#e08a7c; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121615; --sheet:#191e1d; --sunk:#222827; --ink:#e3e9e6; --muted:#97a39e; --line:#2d3533;
  --accent:#6db2bd; --accent-ink:#0e1a1c; --accent-soft:#1f3639;
  --ok:#6cc08d; --ok-soft:#1d3326; --warn:#e0a54c; --warn-soft:#382b17; --bad:#ec817b; --bad-soft:#3d2120;
  --stamp:#e08a7c; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:212px minmax(0,1fr);min-height:100vh}
.rail{border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;background:var(--bg)}
.brand{font-family:var(--f-display);font-size:19px;font-weight:700;letter-spacing:.02em;line-height:1.3}
.brand small{display:block;font-family:var(--f-mono);font-size:11px;font-weight:400;color:var(--muted);letter-spacing:.04em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:6px;color:var(--muted)}
.nav button:hover{background:var(--sunk);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--sheet);color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.nav .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.rail-foot{margin-top:auto;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:var(--muted);vertical-align:1px}
.dot.on{background:var(--ok)} .dot.off{background:var(--warn)}
main{min-width:0;padding-inline:28px;padding-block:24px 64px}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
h1{font-family:var(--f-display);font-size:26px;font-weight:700;margin:0;text-wrap:balance;line-height:1.25}
h2{font-family:var(--f-display);font-size:18px;font-weight:600;margin:0 0 10px;text-wrap:balance}
h3{font-size:14px;margin:0 0 6px;font-weight:600}
.sub{color:var(--muted);font-size:13px;margin:4px 0 0}
.eyebrow{font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;font-family:var(--f-mono)}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--sheet);border-radius:6px;padding:6px 12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--sunk)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stack{display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:16px}
.kpi{background:var(--sheet);padding:14px 16px}
.kpi b{display:block;font-family:var(--f-mono);font-size:26px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi span{font-size:12.5px;color:var(--muted)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--sheet)}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500;background:var(--sunk);position:sticky;top:0}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:color-mix(in srgb,var(--accent-soft) 35%,transparent)}
td .t1{font-weight:600}
td .t2{font-size:12.5px;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.star{all:unset;cursor:pointer;font-size:17px;line-height:1.2;color:var(--muted)}
.star[aria-pressed="true"]{color:var(--warn)}
.star:hover{color:var(--warn)}
.star:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;max-width:360px;cursor:pointer;margin-top:2px}
.clamp.open{-webkit-line-clamp:unset;display:block}
.chip{cursor:pointer;border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:3px 11px;font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.score{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums}
.score.hi{color:var(--ok)} .score.mid{color:var(--warn)} .score.lo{color:var(--bad)}
input[type=text],input[type=url],input[type=date],input[type=datetime-local],input[type=number],input[type=search],select,textarea{
  width:100%;border:1px solid var(--line);background:var(--sheet);border-radius:6px;padding:6px 9px;min-width:0}
textarea{resize:vertical;min-height:80px;line-height:1.55}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);min-width:0}
label.f > span{font-weight:500}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted);background:var(--sheet)}
.empty h3{color:var(--ink);font-family:var(--f-display);font-size:16px}
.note{font-size:12.5px;color:var(--muted)}
.callout{border-left:3px solid var(--warn);background:var(--warn-soft);padding:9px 12px;border-radius:0 6px 6px 0;font-size:13px}
.callout.info{border-color:var(--accent);background:var(--accent-soft)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.date-tag{font-family:var(--f-mono);font-size:12px;min-width:78px;color:var(--muted);font-variant-numeric:tabular-nums}
.date-tag b{display:block;font-size:15px;color:var(--ink);font-weight:500}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:8px 14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent);font-weight:600}
.tabs button:focus-visible{outline:2px solid var(--accent)}
.back{all:unset;cursor:pointer;color:var(--muted);font-size:13px}
.back:hover{color:var(--ink)}
.gauge{width:108px;height:108px;flex:none}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.md p{margin:0 0 8px} .md ul{margin:0 0 8px;padding-left:20px} .md li{margin:2px 0}
.diff ins{background:var(--ok-soft);color:var(--ok);text-decoration:none;border-radius:2px}
.diff del{background:var(--bad-soft);color:var(--bad);border-radius:2px}
.bullet{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.bullet:last-child{border-bottom:0}
.why{font-size:12.5px;color:var(--muted);margin-top:4px}
.why::before{content:"改动原因 · ";color:var(--accent)}
.log{font-family:var(--f-mono);font-size:12px;color:var(--muted);background:var(--sunk);border-radius:6px;padding:8px 10px;max-height:180px;overflow:auto;white-space:pre-wrap}
.stamp{display:inline-block;border:1.5px solid var(--stamp);color:var(--stamp);font-family:var(--f-display);font-size:12px;padding:0 6px;border-radius:3px;transform:rotate(-2deg)}
.drop{border:1.5px dashed var(--accent);border-radius:var(--r);padding:22px;text-align:center;background:var(--accent-soft);cursor:pointer}
.drop.over{background:var(--sheet)}
.q{padding:10px 0;border-bottom:1px solid var(--line)} .q:last-child{border-bottom:0}
.q summary{cursor:pointer;font-weight:600}
.modal-bg{position:fixed;inset:0;background:rgba(10,16,15,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 16px;z-index:50;overflow:auto}
.modal{background:var(--sheet);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);width:min(640px,100%);padding:20px;display:flex;flex-direction:column;gap:14px}
.modal.wide{width:min(860px,100%)}
.toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:6px;z-index:60;max-width:min(420px,calc(100vw - 32px));box-shadow:var(--shadow)}
.toast.bad{background:var(--bad);color:#fff}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;padding:10px 16px;gap:12px;z-index:20;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .brand small,.rail-foot{display:none}
  .brand{font-size:15px;white-space:nowrap}
  .nav{flex-direction:row}
  .nav button{white-space:nowrap;gap:6px}
  main{padding-inline:16px}
  .grid2,.grid3{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>

<div class="app">
  <aside class="rail">
    <div class="brand">求职工作台<small>KALEDIN · 2027 CYCLE</small></div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot" id="railfoot"></div>
  </aside>
  <main id="main">
    <div class="empty"><h3>正在载入</h3><p>连接你的求职数据…</p></div>
  </main>
</div>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>
<script>
"use strict";
/* ============ constants ============ */
const DIRS = ["政府机关/事业单位", "高校教职、辅导员、博士后", "国企央企"];
const STATUSES = ["待投递", "已投递", "测评", "笔试", "一面", "二面", "三面", "终面", "HR面", "Offer", "已拒绝", "已放弃"];
const EVENT_STAGES = new Set(["测评", "笔试", "一面", "二面", "三面", "终面", "HR面"]);
const DONE = new Set(["Offer", "已拒绝", "已放弃"]);
const EXP_TYPES = { intern: "实习", work: "工作", research: "科研", project: "项目", leadership: "学生工作/社团", publication: "论文/成果", award: "获奖", other: "其他" };
const HOST = "host:claude_browser";
const LIBS = {
  pdf: "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js",
  pdfw: "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js",
  mammoth: "https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js",
  xlsx: "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js",
  docx: "https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js",
};
const VIEWS = [
  ["dash", "总览"], ["apps", "投递"], ["companies", "公司库"], ["resumes", "简历与经历"], ["profile", "报名信息"], ["calendar", "日程"],
];
const COLLS = ["resumes", "experiences", "companies", "applications", "tailored", "analyses", "queue"];

/* ============ state ============ */
const S = {
  db: null, sample: null, mcp: null, dl: null, user: null, hostOK: false, ready: false, fatal: "",
  d: { profile: null, meta: null, resumes: [], experiences: [], companies: [], applications: [], tailored: [], analyses: [], queue: [] },
  view: "dash", appId: null, appTab: "match",
  cf: { q: "", dir: "", open: true, star: false, sort: "new", src: "", wait: false }, af: { q: "", status: "" },
  busy: {}, logs: {}, profileDirty: false, tailorSel: {},
};
try { const v = localStorage.getItem("jd_view"); if (v && VIEWS.some(x => x[0] === v)) S.view = v; } catch (e) {}

/* ============ helpers ============ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeURL = s => esc(/^https?:\/\//i.test(String(s || "")) ? s : "#");
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const today = () => { const d = new Date(); return ymd(d); };
function ymd(d) { const p = n => String(n).padStart(2, "0"); return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()); }
function hm(d) { const p = n => String(n).padStart(2, "0"); return p(d.getHours()) + ":" + p(d.getMinutes()); }
function hashId(str) { let h1 = 0x811c9dc5, h2 = 0; for (const ch of String(str)) { const c = ch.codePointAt(0); h1 = Math.imul(h1 ^ c, 16777619) >>> 0; h2 = (h2 * 31 + c) >>> 0; } return "c" + h1.toString(36) + h2.toString(36); }
function daysLeft(dstr) { if (!dstr || !/^\d{4}-\d{2}-\d{2}/.test(dstr)) return null; const t = new Date(dstr.slice(0, 10) + "T23:59:59"); return Math.ceil((t - Date.now()) / 864e5); }
function scoreCls(s) { return s >= 75 ? "hi" : s >= 55 ? "mid" : "lo"; }
function statusPill(s) {
  const cls = s === "Offer" ? "ok" : (s === "已拒绝" || s === "已放弃") ? "bad" : EVENT_STAGES.has(s) ? "warn" : s === "已投递" ? "acc" : "";
  return `<span class="pill ${cls}">${esc(s || "待投递")}</span>`;
}
function dlPill(d) {
  const n = daysLeft(d);
  if (n === null) return d ? `<span class="pill">${esc(d)}</span>` : `<span class="note">—</span>`;
  if (n < 0) return `<span class="pill bad">已截止</span>`;
  if (n <= 3) return `<span class="pill bad mono">${n} 天</span>`;
  if (n <= 10) return `<span class="pill warn mono">${n} 天</span>`;
  return `<span class="pill mono">${esc(d.slice(5, 10))}</span>`;
}
function mmdd(s) {
  if (!s) return "—";
  return /^\d{4}-\d{2}-\d{2}/.test(s) ? s.slice(5, 10).replace("-", "/") : String(s).slice(0, 12);
}
function periodCell(c) {
  const open = c.openDate, end = c.deadline;
  const toOpen = daysLeft(open);
  let status;
  if (c.status === "notStarted" && !end) return `<span class="pill">招聘未开始</span><div class="t2">每日关注中</div>`;
  if (c.status === "watch" && !end) return `<span class="pill warn">待确认是否开放</span><div class="t2">每日关注中</div>`;
  if (c.status === "open" && !end && !open) return `<span class="pill ok">已在招</span><div class="t2">截止待确认</div>`;
  if (toOpen !== null && toOpen > 0) status = `<span class="pill acc mono">${toOpen} 天后开放</span>`;
  else {
    const n = daysLeft(end);
    status = n === null ? (end ? "" : `<span class="note">截止未知</span>`) : n < 0 ? `<span class="pill bad">已截止</span>` : n <= 3 ? `<span class="pill bad mono">剩 ${n} 天</span>` : n <= 10 ? `<span class="pill warn mono">剩 ${n} 天</span>` : `<span class="pill ok">报名中</span>`;
  }
  return `<div class="mono" style="white-space:nowrap" title="${esc((open || "未知") + " 至 " + (end || "未知"))}">${esc(mmdd(open))} → ${esc(mmdd(end))}</div>${status ? `<div style="margin-top:2px">${status}</div>` : ""}`;
}
function md(text) {
  if (!text) return "";
  const lines = String(text).split(/\n/);
  let out = "", inList = false;
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  for (let raw of lines) {
    const l = raw.trim();
    if (/^[-•·*]\s+/.test(l) || /^\d+[.、)]\s*/.test(l)) {
      if (!inList) { out += "<ul>"; inList = true; }
      out += "<li>" + inline(l.replace(/^([-•·*]|\d+[.、)])\s*/, "")) + "</li>";
    } else {
      if (inList) { out += "</ul>"; inList = false; }
      if (l) out += "<p>" + inline(l) + "</p>";
    }
  }
  if (inList) out += "</ul>";
  return `<div class="md">${out}</div>`;
}
let toastT;
function toast(msg, bad) { const t = $("#toast"); t.textContent = msg; t.className = "toast" + (bad ? " bad" : ""); t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, bad ? 6000 : 3200); }
function loadScript(src) {
  loadScript.pending ||= new Map();
  if (loadScript.pending.has(src)) return loadScript.pending.get(src);
  const task = new Promise((res, rej) => {
    const s = document.createElement("script"); s.src = src; s.onload = res;
    s.onerror = () => { s.remove(); loadScript.pending.delete(src); rej(new Error("加载组件失败：" + src.split("/").pop() + "，请确认已运行 prepare_assets.py 后重试。")); };
    document.head.appendChild(s);
  });
  loadScript.pending.set(src, task); return task;
}
function errText(e) {
  const c = e && e.code;
  const map = {
    not_granted: "这个网页还没获准调用 Claude，可在页面右上角的权限菜单里允许。",

async function fileText(file) {

  if (name.endsWith(".pdf")) {
    await loadScript(LIBS.pdf); await loadScript(LIBS.pdfw);
    const lib = window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc = LIBS.pdfw;
    const pdf = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
    let out = "";
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i); const c = await page.getTextContent();
      let lastY = null;
      for (const it of c.items) { const y = it.transform ? it.transform[5] : null; if (lastY !== null && y !== null && Math.abs(y - lastY) > 2) out += "\n"; out += it.str; lastY = y; }
      out += "\n\n";
    }
    return out;
  }
  if (name.endsWith(".docx")) {
    await loadScript(LIBS.mammoth);

}

    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, dt, true); lh.setUint16(12, dd, true); lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true);
    lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);

    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, dt, true); ch.setUint16(14, dd, true); ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true);
    ch.setUint16(28, name.length, true); ch.setUint32(42, off, true);

function readProfileForm() {
  const f = $("#pf"); const p = { basic: {}, education: [], qa: [], targets: [] };
  for (const el of f.querySelectorAll("[name]")) {
    const n = el.name, v = (el.value || "").trim();
    if (n === "t") { if (el.checked) p.targets.push(el.value); continue; }
    const parts = n.split(".");
    if (parts[0] === "b") p.basic[parts[1]] = v;
    else if (parts[0] === "e") { (p.education[+parts[1]] = p.education[+parts[1]] || {})[parts[2]] = v; }
    else if (parts[0] === "q") { (p.qa[+parts[1]] = p.qa[+parts[1]] || {})[parts[2]] = v; }
    else p[n] = v;
  }
  p.education = p.education.filter(e => e && Object.values(e).some(Boolean));
  p.qa = p.qa.filter(x => x && (x.q || x.a));
  return p;
}

function gauge(score) {

  <circle cx="54" cy="54" r="${r}" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c * v} ${c}" transform="rotate(-90 54 54)"/>
  <text x="54" y="60" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="26" fill="var(--ink)">${score}</text></svg>`;
}

function lcsDiff(a, b) {
  a = [...a]; b = [...b];
  if (a.length * b.length > 250000) return `<del>${esc(a.join(""))}</del><br><ins>${esc(b.join(""))}</ins>`;
  const n = a.length, m = b.length, dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  let i = 0, j = 0, out = "", buf = "", mode = "";
  const flush = () => { if (!buf) return; out += mode === "d" ? `<del>${esc(buf)}</del>` : mode === "i" ? `<ins>${esc(buf)}</ins>` : esc(buf); buf = ""; };
  const push = (md, ch) => { if (md !== mode) { flush(); mode = md; } buf += ch; };
  while (i < n && j < m) { if (a[i] === b[j]) { push("", a[i]); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) { push("d", a[i]); i++; } else { push("i", b[j]); j++; } }
  while (i < n) push("d", a[i++]); while (j < m) push("i", b[j++]); flush();
  return out;
}

function localDatabase(initial) {
  let docs = initial;
  const listeners = new Set();
  const snapshot = path => ({ exists: Object.hasOwn(docs, path), data: () => structuredClone(docs[path]) });
  function notify() { for (const f of listeners) f(); }
  async function write(operation, path, data = {}) {
    await api("/api/document", { operation, path, data });
    // Refetch the committed state. Never show an unacknowledged write as saved.
    await refresh();
  }
  async function refresh() {
    const result = await api("/api/state");
    if (JSON.stringify(result.documents) !== JSON.stringify(docs)) { docs = result.documents; notify(); }
  }
  return {
    refresh,
    collection(name) { return { onSnapshot(fn) {
      const emit = () => fn({ docs: Object.keys(docs).filter(p => p.startsWith(name + "/")).map(p => ({ id: p.split("/")[1], data: () => structuredClone(docs[p]) })) });
      listeners.add(emit); emit(); return () => listeners.delete(emit);
    } }; },
    doc(path) { return {
      set: data => write("set", path, data), update: data => write("update", path, data), delete: () => write("delete", path),
      onSnapshot(fn) { const emit = () => fn(snapshot(path)); listeners.add(emit); emit(); return () => listeners.delete(emit); },
    }; },
  };
}

// CSV import works offline; Excel remains supported via the original parser.
function parseCSV(text) {
  const rows = []; let row = [], field = "", quoted = false;
  text = text.replace(/^\uFEFF/, "");
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (c === '"') { if (quoted && text[i + 1] === '"') { field += '"'; i++; } else quoted = !quoted; }
    else if (c === ',' && !quoted) { row.push(field); field = ""; }
    else if ((c === '\n' || c === '\r') && !quoted) {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(field); if (row.some(Boolean)) rows.push(row); row = []; field = "";
    } else field += c;
  }
  if (quoted) throw new Error("CSV 引号未闭合，请检查文件格式。");
  row.push(field); if (row.some(Boolean)) rows.push(row);
  const headers = rows.shift() || [];
  return rows.map(values => Object.fromEntries(headers.map((h, i) => [h, values[i] || ""])));
}

  }
  async connect() {
    const repo = await this.github(this.root);
    if (repo.private !== true) throw new Error("数据仓库必须为 Private（私有）。为保护你的记录，工作台拒绝向公开仓库保存资料。");
    if (repo.permissions && repo.permissions.push !== true) throw new Error("此令牌没有数据仓库的写入权限。");
    await this.readState();
  }
  async file(path, missingOK = false) {
    const value = await this.github(this.root + "/contents/" + path.split("/").map(encodeURIComponent).join("/"), { missingOK });
    if (!value) return null;
    if (typeof value.content === "string" && value.encoding === "base64") return { sha: value.sha, bytes: unbase64(value.content) };
    if (!value.sha || Array.isArray(value)) throw new Error("数据仓库中的文件格式异常。");
    const blob = await this.github(this.root + "/git/blobs/" + value.sha);
    return { sha: value.sha, bytes: unbase64(blob.content) };
  }
  async readState() {
    const file = await this.file(GITHUB_STATE, true);
    if (!file) { this.documents = {}; return { documents: {}, sha: null }; }
    let state;
    try { state = JSON.parse(new TextDecoder().decode(file.bytes)); } catch (_) { throw new Error("云端数据文件无法解析。为避免覆盖记录，已停止保存，请先检查版本历史。"); }
    if (!state || state.format !== "jobsearch-workbench-v1" || !state.documents || typeof state.documents !== "object" || Array.isArray(state.documents)) throw new Error("云端数据格式不正确，未执行覆盖。");
    this.documents = state.documents;
    return { documents: state.documents, sha: file.sha };
  }
  serial(task) {
    const result = this.queue.then(task); this.queue = result.catch(() => {}); return result;
  }
  async changeDocuments(change) {
    return this.serial(async () => {
      for (let attempt = 0; attempt < 3; attempt++) {
        const state = await this.readState(); const documents = structuredClone(state.documents);
        change(documents);
        const body = { message: "Save private workbench records", content: bytes64(new TextEncoder().encode(JSON.stringify({ format: "jobsearch-workbench-v1", documents }))), ...(state.sha ? { sha: state.sha } : {}) };
        try {
          await this.github(this.root + "/contents/" + GITHUB_STATE, { method: "PUT", body: JSON.stringify(body) });
          this.documents = documents; return { ok: true };
        } catch (error) { if (![409, 422].includes(error.status) || attempt === 2) throw error; }
      }
    });
  }
  async putFile(file, id = crypto.randomUUID().replace(/-/g, "")) {
    if (!file.size || file.size > 15 * 1024 * 1024) throw new Error("单个文件需大于 0 且不超过 15MB。");
    const path = "workbench/files/" + id;
    const data = new Uint8Array(await file.arrayBuffer());
    const existing = await this.file(path, true);
    await this.serial(() => this.github(this.root + "/contents/" + path, { method: "PUT", body: JSON.stringify({ message: "Save private workbench attachment", content: bytes64(data), ...(existing ? { sha: existing.sha } : {}) }) }));
    const metadata = { name: file.name, mime: file.type || "application/octet-stream", size: file.size, path, createdAt: new Date().toISOString() };
    await this.changeDocuments(docs => { docs["attachments/" + id] = metadata; });
    if (S.db) await S.db.refresh();
    return { id, ...metadata };
  }
  async attachment(id) {
    const metadata = this.documents["attachments/" + id];
    if (!metadata || metadata.path !== "workbench/files/" + id) throw new Error("附件不存在或路径异常。");
    const file = await this.file(metadata.path);
    return { metadata, bytes: file.bytes };
  }
  async backup() {
    const state = await this.readState(); const files = [];
    for (const [path, metadata] of Object.entries(state.documents)) if (path.startsWith("attachments/")) {
      const id = path.split("/")[1]; const file = await this.attachment(id);
      files.push({ id, name: metadata.name, mime: metadata.mime, data: bytes64(file.bytes) });
    }
    return { format: "jobsearch-workbench-v1", documents: state.documents, files };
  }
  async request(path, body, signal) {
    if (path === "/api/state") return this.readState();
    if (path === "/api/status") return { storage: "github-private", ai: { provider: "github", configured: true, lastResult: "untested", search: false } };
    if (path === "/api/document") {
      if (!/^(profile|meta|resumes|experiences|companies|applications|tailored|analyses|queue|attachments)\/[A-Za-z0-9_-]{1,200}$/.test(body.path)) throw new Error("无效的记录路径。");
      return this.changeDocuments(docs => {
        if (body.operation === "delete") delete docs[body.path];
        else if (body.operation === "set") docs[body.path] = body.data;
        else if (body.operation === "update" && docs[body.path]) docs[body.path] = { ...docs[body.path], ...body.data };
        else throw new Error("记录不存在或操作无效。");
      });
    }
    if (path === "/api/backup") return this.backup();
    if (path === "/api/restore") {
      if (body.format !== "jobsearch-workbench-v1" || !body.documents || typeof body.documents !== "object" || Array.isArray(body.documents)) throw new Error("备份格式不正确。");
      for (const [key, value] of Object.entries(body.documents)) if (!/^(profile|meta|resumes|experiences|companies|applications|tailored|analyses|queue|attachments)\/[A-Za-z0-9_-]{1,200}$/.test(key) || !value || typeof value !== "object" || Array.isArray(value)) throw new Error("备份包含无效记录。");
      // Git commit history retains the pre-import state. No force push or reset.
      for (const file of body.files || []) {
        if (!/^[a-f0-9]{32}$/.test(file.id)) throw new Error("备份中的附件标识无效。");
        await this.putFile(new File([unbase64(file.data)], file.name, { type: file.mime }), file.id);
      }
      await this.changeDocuments(docs => Object.assign(docs, body.documents));
      return { count: Object.keys(body.documents).length };
    }
    if (path === "/api/ai") return this.ai(body, signal);
    throw new Error("当前 GitHub 模式不支持此操作。");
  }
  async ai(body, signal) {
    if (body.search) throw new Error("GitHub Models 不提供联网检索。请粘贴招聘或面试资料后分析。");
    const content = [{ type: "text", text: body.prompt }, ...(body.images || []).map(url => ({ type: "image_url", image_url: { url } }))];
    let response;
    try { response = await fetch("https://models.github.ai/inference/chat/completions", { method: "POST", signal, headers: { Authorization: "Bearer " + this.token, "Content-Type": "application/json", Accept: "application/vnd.github+json" }, body: JSON.stringify({ model: "openai/gpt-4.1", messages: [{ role: "system", content: '你是求职助手，只依据输入资料回答，不编造经历。只输出 JSON 对象。' + (body.text ? '将转录结果放在 text 字段。' : '') }, { role: "user", content }], response_format: { type: "json_object" }, max_tokens: 4000 }) }); }
    catch (_) { throw new Error("无法连接 GitHub Models，请检查网络。"); }
    if (!response.ok) throw new Error(response.status === 429 ? "GitHub Models 请求额度已用完，请稍后重试；你的文件已保存在私有仓库。" : "GitHub Models 调用失败，请确认令牌启用了 Models 读取权限，并且账户可用该模型。");
    const result = await response.json(); let value;
    try { value = JSON.parse(result.choices[0].message.content); } catch (_) { throw new Error("AI 返回格式异常，未保存分析，请重试。"); }
    if (!value || typeof value !== "object" || Array.isArray(value)) throw new Error("AI 返回的不是 JSON 对象。");
    return value;
  }
}

  addQA: () => { const p = readProfileForm(); p.qa.push({}); S.d.profile = { ...(S.d.profile || {}), ...p }; S.profileDirty = true; render(true); },
  async profileFromResume() { if (S.profileDirty) { toast("先保存当前修改。", true); return; } await organize(); },
};
const CHANGE = {
  status: t => setStatus(t.dataset.id, t.value),
  engine: t => { S.engine = t.value; try { localStorage.setItem("jd_engine", t.value); } catch (e) {} },
  cfOpen: t => { S.cf.open = t.checked; render(); },
  cfSort: t => { S.cf.sort = t.value; render(); },
  tsel: t => { const id = t.dataset.app; const set = new Set(S.tailorSel[id] || []); t.checked ? set.add(t.value) : set.delete(t.value); S.tailorSel[id] = [...set]; },
  async tacc(t) { const td = S.d.tailored.find(x => x.id === t.dataset.app); if (!td) return; const accepted = { ...(td.accepted || {}), [t.dataset.k]: t.checked }; await db.update("tailored/" + td.id, { accepted }); },
  fillOn: t => { if (S.fill) { S.fill.fills[+t.dataset.i].on = t.checked; render(); } },
  scPick: t => { S.sched.pick = +t.value; },
  resumeFiles: t => uploadResumes([...t.files]),
};
async function pdfPageImages(file, maxPages) {
  await loadScript(LIBS.pdf); await loadScript(LIBS.pdfw);
  const lib = window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc = LIBS.pdfw;
  const pdf = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  const out = [];
  for (let i = 1; i <= Math.min(pdf.numPages, maxPages); i++) {
    const page = await pdf.getPage(i);
    const base = page.getViewport({ scale: 1 });
    const vp = page.getViewport({ scale: Math.min(2.2, 1800 / Math.max(base.width, base.height)) });
    const cv = document.createElement("canvas"); cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
    const ctx = cv.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height);
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    out.push(await new Promise(r => cv.toBlob(r, "image/jpeg", 0.88)));
  }
  return { images: out, total: pdf.numPages };
}
async function ocrImages(images, name) {
  if (!S.sample) throw { code: "unavailable" };
  const lim = await S.sample.limits().catch(() => null);
  if (!lim || !lim.images) throw { message: "当前 AI 不支持图片识别，请上传 TXT 或 Markdown 文本。" };
  const per = Math.max(1, Math.min(lim.images.maxCount || 1, 5));
  let text = "";
  for (let i = 0; i < images.length; i += per) {
    const batch = images.slice(i, i + per);
    setBusy("upload", `OCR 识别 ${name}：第 ${i + 1}–${i + batch.length} 页 / 共 ${images.length} 页…`);
    const r = await S.sample(`这些图片是一份简历的第 ${i + 1} 到第 ${i + batch.length} 页。请逐字转录图片中的全部文字，保持原有的段落和条目顺序：标题单独成行，每个条目一行，表格按「字段：内容」逐行写出。不要总结、不要改写、不要补充图片里没有的内容；看不清的字用 [?] 标出。只输出转录文本。`, { images: batch.length === 1 ? batch[0] : batch, modelTier: "default", cache: false });
    text += r.text + "\n\n";
  }
  return text;
}
async function uploadResumes(files) {
  let saved = 0;
  for (const f of files) {
    setBusy("upload", "读取 " + f.name + "…");
    try {
      const original = await archiveFile(f);
      const lower = f.name.toLowerCase();
      let text = "", ocr = false;
      if (/\.(png|jpe?g|webp)$/.test(lower)) { text = await ocrImages([f], f.name); ocr = true; }
      else {
        text = (await fileText(f)).replace(/\n{3,}/g, "\n\n").trim();
        if (lower.endsWith(".pdf") && text.replace(/\s/g, "").length < 150) {
          toast(f.name + " 是扫描件或图片版，改用 OCR 识别…");
          const { images, total } = await pdfPageImages(f, 8);
          text = await ocrImages(images, f.name); ocr = true;
          if (total > 8) toast(`只识别了前 8 页（共 ${total} 页）。`);
        }
      }
      text = text.replace(/\n{3,}/g, "\n\n").trim();
      if (text.length < 30) { toast(f.name + " 没识别出文字，请检查文件或上传 TXT / Markdown。", true); continue; }
      await db.set("resumes/" + uid(), { title: f.name, text: text.slice(0, 120000), ocr, ...(original ? { fileId: original.id } : {}), createdAt: new Date().toISOString() });
      saved++;
      if (ocr) toast(f.name + " 已通过 OCR 识别。建议点「查看」核对一遍，标 [?] 的是没看清的字。");
    } catch (e) { toast(f.name + "：" + (e.message || errText(e)), true); }
  }
  setBusy("upload", false);
  if (saved) toast(`已保存 ${saved} 份简历。点「AI 整理经历库」把它们合并成经历库。`);
}

/* ============ wiring ============ */
document.addEventListener("click", e => { const t = e.target.closest("[data-act]"); if (!t) return; const f = ACT[t.dataset.act]; if (f) { if (t.tagName === "BUTTON" || t.tagName === "A") e.preventDefault(); Promise.resolve().then(() => f(t, e)).catch(error => toast(errText(error), true)); } });
document.addEventListener("change", e => { const t = e.target.closest("[data-change]"); if (t && CHANGE[t.dataset.change]) Promise.resolve().then(() => CHANGE[t.dataset.change](t, e)).catch(error => toast(errText(error), true)); });
document.addEventListener("input", e => {
  const t = e.target;
  if (t.closest("#pf")) { if (!S.profileDirty) { S.profileDirty = true; const h = $(".head .row"); if (h && !h.querySelector(".pill.warn")) h.insertAdjacentHTML("afterbegin", `<span class="pill warn">有未保存的修改</span>`); } return; }
  const k = t.dataset && t.dataset.input;
  if (k === "afq" || k === "cfq") { if (e.isComposing || S.composing) return; scheduleSearch(t, k); }
});
/* 中文输入法：拼音组字期间不重绘（重绘会替换输入框，打断组字），组字结束后再搜索 */
function scheduleSearch(t, k) {
  (k === "afq" ? S.af : S.cf).q = t.value;
  clearTimeout(S._searchT);
  S._searchT = setTimeout(() => {
    if (S.composing) return;
    const cur = $(`[data-input="${k}"]`); const pos = cur && document.activeElement === cur ? cur.selectionStart : null;
    render();
    const el = $(`[data-input="${k}"]`);
    if (el) { el.focus(); const p = pos == null ? el.value.length : Math.min(pos, el.value.length); el.setSelectionRange(p, p); }
  }, 300);
}
document.addEventListener("compositionstart", e => { if (e.target.dataset && /^(afq|cfq)$/.test(e.target.dataset.input || "")) { S.composing = true; clearTimeout(S._searchT); } });
document.addEventListener("compositionend", e => { const k = e.target.dataset && e.target.dataset.input; if (k === "afq" || k === "cfq") { S.composing = false; scheduleSearch(e.target, k); if (S._pendingRender) { S._pendingRender = false; } } });
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#modal").innerHTML) closeModal(); });
document.addEventListener("dragover", e => { const d = e.target.closest && e.target.closest("#drop"); if (d) { e.preventDefault(); d.classList.add("over"); } });
document.addEventListener("dragleave", e => { const d = e.target.closest && e.target.closest("#drop"); if (d) d.classList.remove("over"); });
document.addEventListener("drop", e => { const d = e.target.closest && e.target.closest("#drop"); if (d) { e.preventDefault(); d.classList.remove("over"); uploadResumes([...e.dataTransfer.files]); } });

S.engine = "bing"; try { S.engine = localStorage.getItem("jd_engine") || "bing"; } catch (e) {}
async function boot() {
  render();
  const c = window.claude;
  if (!c && (location.hostname.endsWith(".github.io") || new URLSearchParams(location.search).has("github"))) { githubLogin(); return; }
  if (!c || !c.use) { await localBoot(); return; }
  const get = n => c.use(n).catch(() => null);
  const [dbx, sample, dl, user] = await Promise.all([get("db"), get("sample"), get("downloads"), get("user")]);
  Object.assign(S, { db: dbx, sample, dl, user });
  if (!dbx) { S.fatal = "需要登录 claude.ai 才能读取你的求职数据。"; render(); return; }
  subscribe();
  S.ready = true; render();
  const mcp = await get("mcp"); S.mcp = mcp;
  if (mcp) { try { const r = await mcp.listTools(); S.hostOK = (r.servers || []).some(s => s.server === HOST); } catch (e) { S.hostOK = false; } render(); }
}
boot();
</script>
